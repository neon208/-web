<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Studio - 生成 & スキャン</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js for generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5-QRCode for scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styling for canvas and scanning window */
        #qrcode canvas, #qrcode img {
            margin: 0 auto;
            border-radius: 0.5rem;
            max-width: 100%;
            height: auto !important;
        }
        #reader video {
            border-radius: 0.75rem;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col font-sans transition-colors duration-200">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50 bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 pointer-events-none">
        <i id="toast-icon" class="fas fa-check-circle text-green-400 dark:text-green-600"></i>
        <span id="toast-message" class="text-sm font-medium">通知メッセージ</span>
    </div>

    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fas fa-qrcode text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent">
                    QR Code Studio
                </h1>
            </div>

            <!-- Mode Switch Tabs & Theme Toggle -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <nav class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                    <button id="tab-gen" onclick="switchTab('generator')" class="flex items-center space-x-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all duration-150 bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">
                        <i class="fas fa-plus-circle text-brand-500"></i>
                        <span>生成</span>
                    </button>
                    <button id="tab-scan" onclick="switchTab('scanner')" class="flex items-center space-x-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all duration-150 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i class="fas fa-camera"></i>
                        <span>読み取り</span>
                    </button>
                </nav>

                <button id="theme-toggle" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ================= GENERATOR SECTION ================= -->
        <div id="section-generator" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel: Controls & Preset Inputs -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Preset Selector -->
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/60">
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">
                        データタイプを選択
                    </label>
                    <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                        <button onclick="selectPreset('url')" id="preset-url" class="preset-btn active flex flex-col items-center p-3 rounded-xl border border-brand-500 bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 transition-all">
                            <i class="fas fa-link text-lg mb-1"></i>
                            <span class="text-xs font-medium">URL</span>
                        </button>
                        <button onclick="selectPreset('text')" id="preset-text" class="preset-btn flex flex-col items-center p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-300 text-slate-600 dark:text-slate-400 transition-all">
                            <i class="fas fa-align-left text-lg mb-1"></i>
                            <span class="text-xs font-medium">テキスト</span>
                        </button>
                        <button onclick="selectPreset('wifi')" id="preset-wifi" class="preset-btn flex flex-col items-center p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-300 text-slate-600 dark:text-slate-400 transition-all">
                            <i class="fas fa-wifi text-lg mb-1"></i>
                            <span class="text-xs font-medium">Wi-Fi</span>
                        </button>
                        <button onclick="selectPreset('email')" id="preset-email" class="preset-btn flex flex-col items-center p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-300 text-slate-600 dark:text-slate-400 transition-all">
                            <i class="fas fa-envelope text-lg mb-1"></i>
                            <span class="text-xs font-medium">メール</span>
                        </button>
                        <button onclick="selectPreset('phone')" id="preset-phone" class="preset-btn flex flex-col items-center p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-300 text-slate-600 dark:text-slate-400 transition-all">
                            <i class="fas fa-phone text-lg mb-1"></i>
                            <span class="text-xs font-medium">電話番号</span>
                        </button>
                    </div>

                    <!-- Dynamic Input Fields -->
                    <div class="mt-5 space-y-4">
                        <!-- URL Input -->
                        <div id="input-group-url" class="input-group">
                            <label class="block text-sm font-medium mb-1">WebサイトURL</label>
                            <input type="url" id="field-url" placeholder="https://example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
                        </div>

                        <!-- Plain Text Input -->
                        <div id="input-group-text" class="input-group hidden">
                            <label class="block text-sm font-medium mb-1">テキスト内容</label>
                            <textarea id="field-text" rows="3" placeholder="QRコードに埋め込むテキストを入力..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all"></textarea>
                        </div>

                        <!-- Wi-Fi Inputs -->
                        <div id="input-group-wifi" class="input-group hidden space-y-3">
                            <div>
                                <label class="block text-sm font-medium mb-1">ネットワーク名 (SSID)</label>
                                <input type="text" id="field-wifi-ssid" placeholder="Wi-Fi ネットワーク名" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-sm font-medium mb-1">パスワード</label>
                                    <input type="password" id="field-wifi-pass" placeholder="暗号化キー" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">暗号化方式</label>
                                    <select id="field-wifi-type" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
                                        <option value="WPA">WPA/WPA2/WPA3</option>
                                        <option value="WEP">WEP</option>
                                        <option value="nopass">暗号化なし</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Email Input -->
                        <div id="input-group-email" class="input-group hidden space-y-3">
                            <div>
                                <label class="block text-sm font-medium mb-1">宛先メールアドレス</label>
                                <input type="email" id="field-email-to" placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">件名 (任意)</label>
                                <input type="text" id="field-email-subject" placeholder="件名" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
                            </div>
                        </div>

                        <!-- Phone Input -->
                        <div id="input-group-phone" class="input-group hidden">
                            <label class="block text-sm font-medium mb-1">電話番号</label>
                            <input type="tel" id="field-phone" placeholder="09012345678" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- Customization Options -->
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/60 space-y-4">
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                        デザイン・品質設定
                    </label>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Foreground Color -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">前景色 (QRドット)</label>
                            <div class="flex items-center space-x-2">
                                <input type="color" id="opt-fgcolor" value="#000000" class="h-10 w-12 rounded-lg cursor-pointer border-0 bg-transparent">
                                <input type="text" id="opt-fgcolor-text" value="#000000" class="flex-grow px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-sm font-mono uppercase bg-slate-50 dark:bg-slate-900">
                            </div>
                        </div>

                        <!-- Background Color -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">背景色</label>
                            <div class="flex items-center space-x-2">
                                <input type="color" id="opt-bgcolor" value="#ffffff" class="h-10 w-12 rounded-lg cursor-pointer border-0 bg-transparent">
                                <input type="text" id="opt-bgcolor-text" value="#ffffff" class="flex-grow px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-sm font-mono uppercase bg-slate-50 dark:bg-slate-900">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <!-- Size Slider -->
                        <div>
                            <div class="flex justify-between text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">
                                <span>サイズ</span>
                                <span id="opt-size-val">256px</span>
                            </div>
                            <input type="range" id="opt-size" min="128" max="512" step="16" value="256" class="w-full accent-brand-600">
                        </div>

                        <!-- Error Correction -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">誤り訂正レベル</label>
                            <select id="opt-ecl" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-sm bg-slate-50 dark:bg-slate-900 focus:outline-none">
                                <option value="L">L - 低 (7%)</option>
                                <option value="M" selected>M - 中 (15%)</option>
                                <option value="Q">Q - 高品質 (25%)</option>
                                <option value="H">H - 最高品質 (30%)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Preview & Download & History -->
            <div class="lg:col-span-5 space-y-6">
                <!-- Preview Box -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/60 flex flex-col items-center justify-center text-center">
                    <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4 w-full text-left">プレビュー</h2>
                    
                    <!-- QR Wrapper -->
                    <div class="p-4 rounded-xl border border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex items-center justify-center min-h-[220px] w-full max-w-[280px]">
                        <div id="qrcode" class="flex justify-center items-center"></div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center space-x-3 w-full mt-6">
                        <button onclick="downloadQR()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-md shadow-brand-500/20 transition-all flex items-center justify-center space-x-2">
                            <i class="fas fa-download"></i>
                            <span>ダウンロード</span>
                        </button>
                        <button onclick="copyQRImage()" title="画像をコピー" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>

                <!-- History Section -->
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/60">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">作成履歴</h3>
                        <button onclick="clearHistory()" class="text-xs text-rose-500 hover:text-rose-600 transition-colors">全削除</button>
                    </div>
                    <div id="history-list" class="space-y-2 max-h-[200px] overflow-y-auto pr-1">
                        <!-- Dynamic items -->
                        <div class="text-center py-4 text-xs text-slate-400">履歴はありません</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= SCANNER SECTION ================= -->
        <div id="section-scanner" class="hidden max-w-2xl mx-auto space-y-6">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/60">
                <h2 class="text-lg font-bold mb-4 flex items-center space-x-2">
                    <i class="fas fa-camera text-brand-500"></i>
                    <span>QRコードをスキャン</span>
                </h2>

                <!-- Scanner Mode Controls -->
                <div class="flex border-b border-slate-200 dark:border-slate-700 mb-4">
                    <button id="scan-tab-cam" onclick="switchScanMethod('camera')" class="py-2 px-4 border-b-2 border-brand-500 font-medium text-sm text-brand-600 dark:text-brand-400">カメラから</button>
                    <button id="scan-tab-file" onclick="switchScanMethod('file')" class="py-2 px-4 border-b-2 border-transparent font-medium text-sm text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">画像ファイルから</button>
                </div>

                <!-- Camera View -->
                <div id="scan-method-camera" class="space-y-4">
                    <div id="reader" class="overflow-hidden rounded-xl bg-black min-h-[250px] flex items-center justify-center"></div>
                    <p class="text-xs text-slate-500 text-center">カメラへのアクセスを許可してください</p>
                </div>

                <!-- File View -->
                <div id="scan-method-file" class="hidden space-y-4">
                    <div class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-8 text-center hover:border-brand-500 transition-colors cursor-pointer" onclick="document.getElementById('qr-input-file').click()">
                        <i class="fas fa-file-image text-3xl text-slate-400 mb-2"></i>
                        <p class="text-sm font-medium">画像ファイルをドラッグ＆ドロップまたは選択</p>
                        <p class="text-xs text-slate-400 mt-1">PNG, JPG, WEBP 対応</p>
                        <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanFromFile(event)">
                    </div>
                </div>

                <!-- Result Box -->
                <div id="scan-result-container" class="mt-6 p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hidden">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">読み取り結果</span>
                    <div id="scan-result-text" class="text-sm font-mono break-all text-slate-800 dark:text-slate-200 mb-3"></div>
                    <div class="flex space-x-2">
                        <button onclick="copyScanResult()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors">
                            <i class="fas fa-copy mr-1"></i>コピー
                        </button>
                        <a id="scan-result-link" href="#" target="_blank" class="hidden bg-brand-600 hover:bg-brand-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors flex items-center">
                            <i class="fas fa-external-link-alt mr-1"></i>開く
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 QR Code Studio. Created with GitHub Pages in mind.</p>
    </footer>

    <!-- Logic Script -->
    <script>
        // --- State Management ---
        let currentPreset = 'url';
        let qrCodeInstance = null;
        let html5QrCode = null;
        let isCameraScanning = false;

        // --- DOM Elements ---
        const qrContainer = document.getElementById('qrcode');
        const fgColorInput = document.getElementById('opt-fgcolor');
        const fgColorText = document.getElementById('opt-fgcolor-text');
        const bgColorInput = document.getElementById('opt-bgcolor');
        const bgColorText = document.getElementById('opt-bgcolor-text');
        const sizeInput = document.getElementById('opt-size');
        const sizeVal = document.getElementById('opt-size-val');
        const eclInput = document.getElementById('opt-ecl');

        // --- Initialization ---
        window.onload = () => {
            setupTheme();
            setupEventListeners();
            updateQRCode();
            renderHistory();
        };

        // Theme Support
        function setupTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        // Switch main tabs (Generator / Scanner)
        function switchTab(tab) {
            const genSection = document.getElementById('section-generator');
            const scanSection = document.getElementById('section-scanner');
            const genTab = document.getElementById('tab-gen');
            const scanTab = document.getElementById('tab-scan');

            if (tab === 'generator') {
                genSection.classList.remove('hidden');
                scanSection.classList.add('hidden');
                genTab.className = "flex items-center space-x-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all duration-150 bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm";
                scanTab.className = "flex items-center space-x-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all duration-150 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
                stopCamera();
            } else {
                genSection.classList.add('hidden');
                scanSection.classList.remove('hidden');
                scanTab.className = "flex items-center space-x-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all duration-150 bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm";
                genTab.className = "flex items-center space-x-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-medium transition-all duration-150 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
                startCamera();
            }
        }

        // --- Event Listeners Setup ---
        function setupEventListeners() {
            // Text inputs listener for dynamic update
            const inputs = document.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    updateQRCode();
                });
            });

            // Color Sync
            fgColorInput.addEventListener('input', (e) => {
                fgColorText.value = e.target.value.toUpperCase();
                updateQRCode();
            });
            bgColorInput.addEventListener('input', (e) => {
                bgColorText.value = e.target.value.toUpperCase();
                updateQRCode();
            });

            sizeInput.addEventListener('input', (e) => {
                sizeVal.innerText = `${e.target.value}px`;
                updateQRCode();
            });
        }

        // --- Preset Selector ---
        function selectPreset(preset) {
            currentPreset = preset;
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.className = "preset-btn flex flex-col items-center p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-300 text-slate-600 dark:text-slate-400 transition-all";
            });

            const activeBtn = document.getElementById(`preset-${preset}`);
            activeBtn.className = "preset-btn active flex flex-col items-center p-3 rounded-xl border border-brand-500 bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 transition-all";

            document.querySelectorAll('.input-group').forEach(group => group.classList.add('hidden'));
            document.getElementById(`input-group-${preset}`).classList.remove('hidden');

            updateQRCode();
        }

        // Get Payload based on Preset
        function getPayload() {
            switch(currentPreset) {
                case 'url':
                    return document.getElementById('field-url').value || 'https://github.com';
                case 'text':
                    return document.getElementById('field-text').value || 'Hello, QR Code!';
                case 'wifi':
                    const ssid = document.getElementById('field-wifi-ssid').value;
                    const pass = document.getElementById('field-wifi-pass').value;
                    const type = document.getElementById('field-wifi-type').value;
                    if(!ssid) return 'WIFI:S:MyNetwork;T:WPA;P:password;;';
                    return `WIFI:S:${ssid};T:${type};P:${pass};;`;
                case 'email':
                    const to = document.getElementById('field-email-to').value;
                    const sub = document.getElementById('field-email-subject').value;
                    if(!to) return 'mailto:info@example.com';
                    return `mailto:${to}${sub ? '?subject=' + encodeURIComponent(sub) : ''}`;
                case 'phone':
                    const phone = document.getElementById('field-phone').value;
                    return phone ? `tel:${phone}` : 'tel:09012345678';
                default:
                    return 'https://github.com';
            }
        }

        // --- Generate QR Code ---
        function updateQRCode() {
            const payload = getPayload();
            const size = parseInt(sizeInput.value);
            const fgColor = fgColorInput.value;
            const bgColor = bgColorInput.value;
            const eclMap = { 'L': QRCode.CorrectLevel.L, 'M': QRCode.CorrectLevel.M, 'Q': QRCode.CorrectLevel.Q, 'H': QRCode.CorrectLevel.H };

            qrContainer.innerHTML = "";

            try {
                qrCodeInstance = new QRCode(qrContainer, {
                    text: payload,
                    width: size,
                    height: size,
                    colorDark: fgColor,
                    colorLight: bgColor,
                    correctLevel: eclMap[eclInput.value] || QRCode.CorrectLevel.M
                });
                
                // Save to history debounce
                clearTimeout(window.historyTimer);
                window.historyTimer = setTimeout(() => {
                    saveHistory(payload);
                }, 1000);

            } catch (err) {
                console.error("QR Generation error", err);
            }
        }

        // --- History Functionality ---
        function saveHistory(text) {
            if (!text || text.trim() === "") return;
            let history = JSON.parse(localStorage.getItem('qr_history') || '[]');
            
            // Remove duplicate if exists
            history = history.filter(item => item.text !== text);
            history.unshift({ text, date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            
            // Keep max 10
            if (history.length > 10) history.pop();
            
            localStorage.setItem('qr_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('qr_history') || '[]');
            
            if (history.length === 0) {
                list.innerHTML = `<div class="text-center py-4 text-xs text-slate-400">履歴はありません</div>`;
                return;
            }

            list.innerHTML = history.map((item, idx) => `
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700/50 text-xs hover:border-brand-300 transition-all cursor-pointer" onclick="useHistoryItem('${encodeURIComponent(item.text)}')">
                    <span class="truncate max-w-[180px] font-mono text-slate-700 dark:text-slate-300">${escapeHtml(item.text)}</span>
                    <span class="text-[10px] text-slate-400">${item.date}</span>
                </div>
            `).join('');
        }

        function useHistoryItem(encodedText) {
            const text = decodeURIComponent(encodedText);
            selectPreset('text');
            document.getElementById('field-text').value = text;
            updateQRCode();
            showToast('履歴を読み込みました');
        }

        function clearHistory() {
            localStorage.removeItem('qr_history');
            renderHistory();
            showToast('履歴を削除しました');
        }

        // --- Download & Copy Image ---
        function downloadQR() {
            const img = qrContainer.querySelector('img');
            const canvas = qrContainer.querySelector('canvas');
            
            let imageURI = "";
            if (canvas) {
                imageURI = canvas.toDataURL("image/png");
            } else if (img) {
                imageURI = img.src;
            }

            if (!imageURI) {
                showToast('画像の生成に失敗しました');
                return;
            }

            const link = document.createElement('a');
            link.download = `qrcode_${Date.now()}.png`;
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('ダウンロードを開始しました');
        }

        function copyQRImage() {
            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) {
                showToast('コピー可能な画像がありません');
                return;
            }

            canvas.toBlob(blob => {
                try {
                    const item = new ClipboardItem({ 'image/png': blob });
                    navigator.clipboard.write([item]);
                    showToast('クリップボードにコピーしました');
                } catch (err) {
                    showToast('コピーに対応していません');
                }
            });
        }

        // --- Scanner Functions ---
        function switchScanMethod(method) {
            const camView = document.getElementById('scan-method-camera');
            const fileView = document.getElementById('scan-method-file');
            const tabCam = document.getElementById('scan-tab-cam');
            const tabFile = document.getElementById('scan-tab-file');

            if (method === 'camera') {
                camView.classList.remove('hidden');
                fileView.classList.add('hidden');
                tabCam.className = "py-2 px-4 border-b-2 border-brand-500 font-medium text-sm text-brand-600 dark:text-brand-400";
                tabFile.className = "py-2 px-4 border-b-2 border-transparent font-medium text-sm text-slate-500 hover:text-slate-700 dark:hover:text-slate-300";
                startCamera();
            } else {
                camView.classList.add('hidden');
                fileView.classList.remove('hidden');
                tabFile.className = "py-2 px-4 border-b-2 border-brand-500 font-medium text-sm text-brand-600 dark:text-brand-400";
                tabCam.className = "py-2 px-4 border-b-2 border-transparent font-medium text-sm text-slate-500 hover:text-slate-700 dark:hover:text-slate-300";
                stopCamera();
            }
        }

        function startCamera() {
            if (isCameraScanning) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                onScanSuccess
            ).then(() => {
                isCameraScanning = true;
            }).catch(err => {
                console.error("Camera start error", err);
            });
        }

        function stopCamera() {
            if (html5QrCode && isCameraScanning) {
                html5QrCode.stop().then(() => {
                    isCameraScanning = false;
                }).catch(err => console.error(err));
            }
        }

        function scanFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const html5Qr = new Html5Qrcode("reader");
            html5Qr.scanFile(file, true)
                .then(decodedText => {
                    onScanSuccess(decodedText);
                })
                .catch(err => {
                    showToast('QRコードを検出できませんでした');
                });
        }

        function onScanSuccess(decodedText) {
            const resContainer = document.getElementById('scan-result-container');
            const resText = document.getElementById('scan-result-text');
            const resLink = document.getElementById('scan-result-link');

            resContainer.classList.remove('hidden');
            resText.innerText = decodedText;

            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                resLink.href = decodedText;
                resLink.classList.remove('hidden');
            } else {
                resLink.classList.add('hidden');
            }

            showToast('読み取り成功！');
        }

        function copyScanResult() {
            const text = document.getElementById('scan-result-text').innerText;
            if(!text) return;
            
            // Clipboard fallback
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast('テキストをコピーしました');
        }

        // --- Helpers ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-message');
            msg.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
